<!DOCTYPE html>
<html>
<head>
    <title>Drag and Drop List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>My To-Do List</h2>
        <p>Drag the items to change their order</p>
        <ul id="list">
            <li draggable="true">Learn HTML</li>
            <li draggable="true">Practice CSS</li>
            <li draggable="true">Learn JavaScript</li>
            <li draggable="true">Build Projects</li>
            <li draggable="true">Upload to GitHub</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
